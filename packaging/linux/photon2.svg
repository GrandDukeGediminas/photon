    <path d="M44 56 L118 112" stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round"/>
    <circle cx="44" cy="56" r="9" fill="#ffffff"/>
  </g>
  <rect x="104" y="192" width="48" height="22" fill="#22252b"/>
  <rect x="76" y="212" width="104" height="14" rx="7" fill="#22252b"/>
