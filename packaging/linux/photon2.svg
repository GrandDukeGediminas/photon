      <stop offset="0" stop-color="#3d2a8c"/>
      <stop offset="0.55" stop-color="#b7409a"/>
      <stop offset="1" stop-color="#f08a4b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c2"/>
      <stop offset="0.6" stop-color="#ffd24a"/>
      <stop offset="1" stop-color="#ff9f2e"/>
