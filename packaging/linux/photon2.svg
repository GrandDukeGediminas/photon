<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- photon2 app icon: a desktop with a wallpaper scene (sky, sun, hills) and a light ray. CC0. -->
  <defs>
