# Flatpak manifest for photon on Linux (docs/linux-port.md §6.2). Built and run with scripts/linux/flatpak.sh (flatpak-builder in a
# privileged container), or on a desktop:
#   flatpak-builder --user --install-deps-from=flathub --install --force-clean build-dir packaging/flatpak/io.github.photon2.Photon.yml
#   flatpak run io.github.photon2.Photon            # the browser; `--background` for the status icon only
#
# Runtime: GNOME 51 (freedesktop 26.08: GTK 3, WebKitGTK 4.1 with its javascriptcoregtk-4.1, GStreamer, PipeWire and
# PulseAudio clients, libpng, libjpeg-turbo, lz4, FreeType, fontconfig, HarfBuzz, X11, Wayland, the Vulkan loader).
# Vulkan and GL drivers come from the runtime's org.freedesktop.Platform.GL extension point (GL.default: Mesa with radv,
# anv, nvk and lavapipe; the NVIDIA extension that matches the host driver), Vulkan layers from
# org.freedesktop.Platform.VulkanLayer. H.264/HEVC: since 25.08 the runtime's codecs-extra extension (which replaced
# org.freedesktop.Platform.ffmpeg-full) is installed with it and is on GST_PLUGIN_SYSTEM_PATH, so gst-libav decodes them
# without anything in this manifest. Built here: OpenAL Soft 1.21.1 (the engine's version, with the fastf2i rounding
# patch, docs/linux-port.md §3.6; it shadows the runtime's 1.25 through /app/lib), glslang and SPIRV-Cross (photon
# compiles the engine's shaders at run time), stb_image as libstb (GIF decoding), gtk-layer-shell (web wallpapers on
# Wayland), and photon itself with the Swift 6 SDK extension (Swift 6.4 on 26.08).
app-id: io.github.photon2.Photon
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.swift6
command: photon-linux
finish-args:
  # Desktop hosts: layer-shell background surfaces on Wayland, DESKTOP-type windows on X11.
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # Vulkan (and WebKit's GL compositing) on the GPU.
  - --device=dri
  # Sound objects and video sound (PulseAudio / pipewire-pulse); the audio spectrum from the default sink's monitor
  # through PipeWire.
  - --socket=pulseaudio
  - --filesystem=xdg-run/pipewire-0
  # Web wallpapers whose page is an http(s) URL, and http(s) media art from MPRIS players.
  - --share=network
  # The user's Wallpaper Engine install and Workshop items (Steam native, the ~/.steam symlink, Steam's Flatpak), read only.
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam:ro
  # Wallpaper property files and folders the user picks (web wallpapers' directory properties).
  - --filesystem=xdg-pictures:ro
  - --filesystem=xdg-videos:ro
  # Status icon (StatusNotifierItem; inside the sandbox the item registers under its unique bus name).
  - --talk-name=org.kde.StatusNotifierWatcher
  # Playback rules and media: screensaver state, MPRIS players, UPower (battery), logind (sleep, lock).
  - --talk-name=org.freedesktop.ScreenSaver
  - --talk-name=org.gnome.ScreenSaver
  - --talk-name=org.mpris.MediaPlayer2.*
  - --system-talk-name=org.freedesktop.UPower
  - --system-talk-name=org.freedesktop.login1
  # GNOME: the photon2 Shell extension (installed separately: a Flatpak cannot install Shell extensions) shows the
  # host's background windows and reports the window states for the rules (docs/linux-port.md §5.2).
  - --talk-name=io.github.photon2.Shell
  # GNOME without layer-shell: the still-background fallback sets org.gnome.desktop.background through dconf.
  - --talk-name=ca.desrt.dconf
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --env=DCONF_USER_CONFIG_DIR=.config/dconf
  # The shader tools built below (photon looks in /usr/bin and /usr/local/bin otherwise).
  - --env=PHOTON_GLSLANG=/app/bin/glslangValidator
  - --env=PHOTON_SPIRV_CROSS=/app/bin/spirv-cross
  # WebKit's own sandbox cannot nest in Flatpak's; WebKitGTK uses Flatpak's sub-sandbox (flatpak-spawn) itself.
build-options:
  append-path: /usr/lib/sdk/swift6/usr/bin
  prepend-ld-library-path: /usr/lib/sdk/swift6/usr/lib
modules:
  - name: openal-soft
    buildsystem: cmake-ninja
    build-options:
      # GCC 15 makes an error of a template member 1.21.1 never instantiates (al::optional::operator*).
      cxxflags: -Wno-template-body
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DALSOFT_UTILS=OFF
      - -DALSOFT_EXAMPLES=OFF
      - -DALSOFT_TESTS=OFF
      - -DALSOFT_EMBED_HRTF_DATA=ON
      - -DALSOFT_REQUIRE_PULSEAUDIO=ON
      # 1.21.1 asks for CMake 3.0; CMake 4 in the 26.08 SDK refuses that without a policy floor.
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/kcat/openal-soft/archive/refs/tags/1.21.1.tar.gz
        sha256: 8ac17e4e3b32c1af3d5508acfffb838640669b4274606b7892aa796ca9d7467f
      - type: shell
        # fastf2i rounds to nearest on every CPU (1.21.1 truncates off x86; docs/linux-port.md §3.6).
        commands:
          - sed -i '/^inline int fastf2i/,/^}/ s/return static_cast<int>(f);/return static_cast<int>(__builtin_lrintf(f));/' common/alnumeric.h

  - name: glslang
    buildsystem: cmake-ninja
    build-options:
      # 14.3.0 relies on <cstdint> arriving through other headers, which GCC 15's libstdc++ no longer does.
      cxxflags: -include cstdint
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_OPT=OFF
      - -DGLSLANG_TESTS=OFF
    sources:
      - type: git
        url: https://github.com/KhronosGroup/glslang.git
        tag: 14.3.0
        commit: fa9c3deb49e035a8abcabe366f26aac010f6cbfb

  - name: spirv-cross
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DSPIRV_CROSS_ENABLE_TESTS=OFF
      - -DSPIRV_CROSS_SHARED=OFF
    sources:
      - type: git
        url: https://github.com/KhronosGroup/SPIRV-Cross.git
        tag: vulkan-sdk-1.3.290.0
        commit: 5d127b917f080c6f052553c47170ec0ba702e54f

  - name: libstb
    buildsystem: simple
    build-commands:
      - printf '#define STB_IMAGE_IMPLEMENTATION\n#include "stb_image.h"\n' > stb_image.c
      - cc -O2 -fPIC -shared -o libstb.so stb_image.c
      - install -Dm644 stb_image.h /app/include/stb/stb_image.h
      - install -Dm755 libstb.so /app/lib/libstb.so
    sources:
      - type: git
        url: https://github.com/nothings/stb.git
        commit: 2c980bb59875b0d32144a71867fbdebb2f77cd20

  - name: gtk-layer-shell
    buildsystem: meson
    config-opts:
      - -Dexamples=false
      - -Ddocs=false
      - -Dtests=false
      - -Dintrospection=false
      - -Dvapi=false
    sources:
      - type: git
        url: https://github.com/wmww/gtk-layer-shell.git
        tag: v0.9.0
        commit: 984dbbfc1d64c763e15a56dff662af267b551f68

  - name: photon
    buildsystem: simple
    build-options:
      env:
        PHOTON_GLSLANG: /app/bin/glslangValidator
        PHOTON_SPIRV_CROSS: /app/bin/spirv-cross
        CPATH: /app/include
        LIBRARY_PATH: /app/lib
        PKG_CONFIG_PATH: /app/lib/pkgconfig:/app/share/pkgconfig
    build-commands:
      # SwiftPM's native build system: with Swift 6.4's default (swiftbuild) engine a --static-swift-stdlib link
      # misses Synchronization and _FoundationCollections from the static Foundation. /app is named explicitly because
      # the build engines do not pass CPATH / LIBRARY_PATH on to clang and the linker.
      # The version is stamped from PHOTON_VERSION_BASE (Sources/CPhotonVersion; `photon-linux --version`).
      - |
        v=$(sed -n 's/^#define PHOTON_VERSION_BASE "\(.*\)"$/\1/p' Sources/CPhotonVersion/include/photon_version.h)
        swift build --build-system native -c release --static-swift-stdlib --product photon-linux -Xcc -I/app/include -Xlinker -L/app/lib -Xcc "-DPHOTON_VERSION=\"$v\""
      - install -Dm755 "$(swift build --build-system native -c release --show-bin-path)/photon-linux" /app/bin/photon-linux
      - install -Dm644 packaging/linux/photon2.svg /app/share/icons/hicolor/scalable/apps/io.github.photon2.Photon.svg
      - install -Dm644 packaging/linux/photon2.svg /app/share/icons/hicolor/scalable/apps/photon2.svg
      - sed 's/^Icon=photon2/Icon=io.github.photon2.Photon/' packaging/linux/photon2.desktop > io.github.photon2.Photon.desktop
      - install -Dm644 io.github.photon2.Photon.desktop /app/share/applications/io.github.photon2.Photon.desktop
      - install -Dm644 packaging/linux/io.github.photon2.Photon.metainfo.xml /app/share/metainfo/io.github.photon2.Photon.metainfo.xml
      - install -Dm644 docs/linux-port.md /app/share/doc/photon2/linux-port.md
    sources:
      - type: dir
        path: ../..
        skip:
          - .build
          - .git
